name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: a title fix reruns the ownership gate
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify PR diff (main always runs full CI)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=full
          if [ "$EVENT" = pull_request ]; then
            scope=$(python3 scripts/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $scope" >> "$GITHUB_STEP_SUMMARY"

      - name: Classifier regression tests
        run: python3 -m unittest discover -s tests/golden -p test_ci_scope.py

      - name: spec lint
        run: python3 scripts/check_ownership.py --lint-specs

      - name: ownership
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/check_ownership.py --title "$PR_TITLE" --base "origin/$BASE_REF"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ownership regression tests
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run pytest -c pyproject.toml ../tests/golden/test_ownership.py -q

  pipeline:
    needs: checks
    if: needs.checks.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: pipeline (ruff, pytest incl. golden)
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q -n auto --durations=10

  web:
    needs: checks
    if: needs.checks.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web (lint, typecheck, build in fixture mode)
        working-directory: web
        env:
          DATA_MODE: fixture
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: National and optional assistant checks
        run: |
          node scripts/check_national_traces.mjs
          if [ -d tests/web/national ]; then
            node --import ./tests/web/loader.mjs --test tests/web/national/*.test.ts
          fi
          if [ -f tests/web/assistant/commands.test.mjs ]; then
            node --test tests/web/assistant/commands.test.mjs
          fi

      - name: Verified operations checks
        run: |
          node scripts/check_operations_traces.mjs
          if [ -d tests/web/verified ]; then
            node --import ./tests/web/loader.mjs --test tests/web/verified/*.test.ts
          fi
          if [ -f tests/web/operations-providers/loader.mjs ]; then
            node --import ./tests/web/operations-providers/loader.mjs --test tests/web/operations-providers/*.test.ts
          fi
          if [ -d tests/web/outcomes ]; then
            node --test tests/web/outcomes/*.test.ts
          fi
          if [ -d tests/web/operations-ui ]; then
            node --test tests/web/operations-ui/*.test.ts
          fi

  # Preserve the required status name, including for docs-only PRs and failures.
  ci:
    needs: [checks, pipeline, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check
        env:
          CHECKS: ${{ needs.checks.result }}
          SCOPE: ${{ needs.checks.outputs.scope }}
          PIPELINE: ${{ needs.pipeline.result }}
          WEB: ${{ needs.web.result }}
        run: |
          test "$CHECKS" = success
          if [ "$SCOPE" = full ]; then
            test "$PIPELINE" = success
            test "$WEB" = success
          else
            test "$SCOPE" = docs
            test "$PIPELINE" = skipped
            test "$WEB" = skipped
          fi

  # Not required. Runs Playwright specs in tests/e2e (F07) against a fixture-mode production build.
  e2e:
    needs: checks
    if: needs.checks.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: detect specs
        id: detect
        run: echo "present=$([ -f tests/e2e/playwright.config.ts ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'yes'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build and serve (fixture mode)
        if: steps.detect.outputs.present == 'yes'
        working-directory: web
        env:
          DATA_MODE: fixture
          NATIONAL_DATA_MODE: snapshot
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start -- -p 3000 > /tmp/next.log 2>&1 &
          npx --yes wait-on@8 -t 60000 http://localhost:3000/

      - name: playwright
        if: steps.detect.outputs.present == 'yes'
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          ln -s web/node_modules node_modules # lets tests/e2e resolve @playwright/test from web/
          browser_status=0
          if [ -f tests/web/national/playwright.config.ts ]; then
            web/node_modules/.bin/playwright test -c tests/web/national/playwright.config.ts --output test-results/national || browser_status=1
          fi
          if [ -f tests/web/assistant/playwright.config.ts ]; then
            web/node_modules/.bin/playwright test -c tests/web/assistant/playwright.config.ts --output test-results/assistant || browser_status=1
          fi
          if [ -f tests/web/operations-ui/playwright.config.ts ]; then
            web/node_modules/.bin/playwright test -c tests/web/operations-ui/playwright.config.ts --output test-results/operations || browser_status=1
          fi
          web/node_modules/.bin/playwright test -c tests/e2e --output test-results/legacy || browser_status=1
          exit "$browser_status"

      - name: Browser evidence
        if: always() && steps.detect.outputs.present == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
