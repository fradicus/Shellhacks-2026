name: load

# The ONLY writer to Atlas (specs/tech-stack.md). Runs the F06 loader on every main push that changes data.
on:
  push:
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch:

concurrency:
  group: load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: load data/ into Atlas
        working-directory: pipeline
        env:
          MONGODB_URI_RW: ${{ secrets.MONGODB_URI_RW }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'gridbridge' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          uv sync --locked
          uv run python -m load
      - name: Load isolated national snapshot when present
        if: ${{ hashFiles('pipeline/national/load.py', 'data/national/projects.json') != '' }}
        working-directory: pipeline
        env:
          MONGODB_URI_RW: ${{ secrets.MONGODB_URI_RW }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'gridbridge' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -f national/load.py ] && [ -f ../data/national/projects.json ]; then
            uv run python -m national.load
          fi
      # C37: the Action's step summary is the publication receipt; no receipt-only PRs.
      - name: Verify Atlas serves the expected publication
        if: ${{ hashFiles('pipeline/national/load.py', 'data/national/projects.json') != '' }}
        working-directory: pipeline
        env:
          MONGODB_URI_RW: ${{ secrets.MONGODB_URI_RW }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'gridbridge' }}
          GIT_SHA: ${{ github.sha }}
        run: uv run python -m common.publication
